# DECAFIA — YOLOv8 training configuration
# All hyperparameters live here. train_decafia.py reads this file.
# Do not hardcode values in the training script.

# ── Model ──────────────────────────────────────────────────────────────────
model: yolov8m        # ultralytics model variant (n/s/m/l/x)

# ── Data ───────────────────────────────────────────────────────────────────
data_yaml: C:\Users\luise\OneDrive\Documentos\decafia\decafia_yolo\data.yaml

# ── Output ─────────────────────────────────────────────────────────────────
project: C:\Users\luise\OneDrive\Documentos\decafia\runs
name:    decafia_yolov8m_v2

# ── Training schedule ──────────────────────────────────────────────────────
epochs:         100
patience:       50       # early stopping — stop if no mAP50 improvement
warmup_epochs:  3

# ── Hardware ───────────────────────────────────────────────────────────────
imgsz:   640
batch:   16              # reduce to 8 if GPU OOM
amp:     true            # automatic mixed precision (FP16)
workers: 4               # DataLoader workers; 8 caused RAM MemoryError on Windows

# ── Optimizer ──────────────────────────────────────────────────────────────
optimizer:     AdamW
lr0:           0.01      # initial learning rate
lrf:           0.001     # final learning rate = lr0 * lrf
momentum:      0.937
weight_decay:  0.0005

# ── Augmentation (applied by ultralytics during training) ──────────────────
hsv_h:        0.015      # hue shift
hsv_s:        0.7        # saturation shift
hsv_v:        0.4        # value (brightness) shift
degrees:      15.0       # rotation
translate:    0.1        # translation fraction
scale:        0.5        # scale jitter
flipud:       0.5        # vertical flip probability
fliplr:       0.5        # horizontal flip probability
mosaic:       1.0        # mosaic augmentation probability
mixup:        0.15       # mixup augmentation probability
close_mosaic: 10         # disable mosaic for last N epochs

# ── Reproducibility ────────────────────────────────────────────────────────
seed: 42
