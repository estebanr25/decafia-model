services:
  - type: web
    name: decafia-bot
    runtime: python
    rootDir: whatsapp_bot
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
